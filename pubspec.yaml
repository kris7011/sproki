name: sproki
description: "Et nyt Flutter projekt til sprogindlæring for børn."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 📊 Hive database - kun det nødvendige 
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # 👤 User data persistence
  shared_preferences: ^2.5.3

  # 🎵 Kun TTS - fjernet problematiske audio packages
  flutter_tts: ^4.2.3

  # 🎨 UI utilities
  cupertino_icons: ^1.0.2
  speech_to_text: ^7.2.0
  share_plus: ^12.0.0
  pdf: ^3.11.3
  intl: ^0.20.2
  just_audio: ^0.10.4
  record: ^6.0.0
  path_provider: ^2.1.5
  flutter_animate: ^4.5.2
  sqflite: ^2.4.2
  path: ^1.9.1
  http: ^1.5.0
  supabase_flutter: ^2.12.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  hydrated_bloc: ^10.1.1
  in_app_purchase: ^3.2.3
  bloc: ^9.0.1
  hive_test: ^1.0.1
  dio: ^5.9.0
  http_parser: ^4.1.2
  file_picker: ^10.3.3
  connectivity_plus: ^7.0.0
  uuid: ^4.5.1
  build_runner: ^2.4.13
  go_router: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.0
  
  # 🔧 Hive code generation
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
    - assets/fonts/NotoSansSymbols2-Regular.ttf
    - assets/fonts/NotoEmoji-Regular.ttf
    - assets/words.json

